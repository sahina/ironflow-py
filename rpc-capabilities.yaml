    method: subscribe
  - path: ironflow.v1.PubSubService/SubscribeBidirectional
    classification: unsupported
    note: >-
      Served, but internal/server/connect/pubsub_handler.go:407 returns CodeUnimplemented. Never generate a method for it.
  - path: ironflow.v1.PubSubService/CreateConsumerGroup
