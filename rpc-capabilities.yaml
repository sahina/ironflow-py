  - path: ironflow.v1.EnvironmentService/DeleteEnvironment
    classification: rest
    rest: "DELETE /api/v1/environments/{id}"
  - path: ironflow.v1.EnvironmentService/RotateAPIKey
    classification: rpc
    capability: environments
    method: rotate_api_key

  # ── EntityStreamService ──
