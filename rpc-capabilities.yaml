  - path: ironflow.v1.IronflowService/GetRunSteps
    classification: rpc
    capability: runs
    method: get_steps
  - path: ironflow.v1.IronflowService/CancelRun
    classification: rpc
    capability: runs
    method: cancel
  - path: ironflow.v1.IronflowService/DeleteRun
    classification: rpc
    capability: runs
    method: delete
  - path: ironflow.v1.IronflowService/DeleteRuns
    classification: rpc
    capability: runs
    method: delete_many
  - path: ironflow.v1.IronflowService/RedactEvent
