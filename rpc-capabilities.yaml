  - path: ironflow.v1.PubSubService/ListConsumerGroups
    classification: rpc
    capability: pubsub
    method: list_consumer_groups
  - path: ironflow.v1.PubSubService/UpdateConsumerGroup
    classification: rpc
    capability: pubsub
    method: update_consumer_group
  - path: ironflow.v1.PubSubService/DeleteConsumerGroup
    classification: rpc
    capability: pubsub
    method: delete_consumer_group
  - path: ironflow.v1.PubSubService/JoinConsumerGroup
    classification: stream
    capability: pubsub
    method: join_consumer_group
  - path: ironflow.v1.PubSubService/AckEvent
    classification: rpc
    capability: pubsub
    method: ack_event
  - path: ironflow.v1.PubSubService/Publish
