  - path: ironflow.v1.ProjectionService/CreateSQLProjection
    classification: rpc
    capability: projections
    method: create_sql
  - path: ironflow.v1.ProjectionService/QuerySQLProjection
    classification: rpc
    capability: projections
    method: query_sql
    note: >-
      POST /api/v1/sql is QueryService/ExecuteSQL (generic read-only SQL), not this. No REST sibling.
  - path: ironflow.v1.ProjectionService/WaitProjectionCatchup
    classification: rpc
    capability: projections
    method: wait_catchup
  - path: ironflow.v1.ProjectionService/WaitProjectionCatchupBatch
    classification: rpc
    capability: projections
    method: wait_catchup_batch
  - path: ironflow.v1.ProjectionService/WaitForEvent
