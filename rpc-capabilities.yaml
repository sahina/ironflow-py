  - path: ironflow.v1.ProjectionService/GetProjectionRevision
    classification: rpc
    capability: projections
    method: get_revision
  - path: ironflow.v1.ProjectionService/GetProjectionStatus
    classification: rpc
    capability: projections
    method: get_status
  - path: ironflow.v1.ProjectionService/RebuildProjection
