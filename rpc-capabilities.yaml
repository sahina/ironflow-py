    method: trigger_sync
  - path: ironflow.v1.IronflowService/InvokeFunctionSync
    classification: rpc
    capability: runs
    method: invoke_function_sync
    note: >-
      Function-id-keyed sync invoke (ADR 0067). InvokeFunction is its async counterpart.
  - path: ironflow.v1.IronflowService/TriggerBatch
    classification: rpc
    capability: runs
