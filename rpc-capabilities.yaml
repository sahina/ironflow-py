# Python SDK ConnectRPC capability ledger (#1781, ADR 0062)
#
# Classifies every served, non-transport ConnectRPC method for the Python SDK.
# The universe is NOT enumerated here: scripts/check-sdk-parity.sh derives it the
# way ADR 0059 does — Connect handler registrations in internal/server/server.go,
# expanded to that service's `rpc Foo(...)` lines in api/proto/ironflow/v1, minus
# RPC_SKIP. This file only answers "what do we do with each one". A served RPC
# with no row here fails the gate by service and method name.
#
# Two files listing 83 paths independently is the failure ADR 0059 was written
# about, so this one holds classification and nothing else.
#
# classification:
#   rest         The generated REST client already delivers this capability.
#                Records WHICH route, so the row is auditable rather than
#                asserted. Not re-exposed: Tier 2 promises capability parity,
#                not endpoint-for-endpoint parity.
#   rpc          Missing unary capability. Exposed by the PR-2 facade.
#   stream       Supported stream. Exposed by the PR-3 facade.
#   unsupported  Served, but not implemented. Never generate a method.
#
# capability:    The namespace the method attaches to (rpc.webhooks, rpc.runs).
#                Only on rpc and stream rows — a rest row is not exposed, so it
#                has no namespace.
#
# method:        The stable PUBLIC method name on that namespace, so the call
#                reads rpc.webhooks.create_source(...). Required on rpc and
#                stream rows, forbidden on rest rows, unique within a namespace
#                — all three checked by the gate.
#
#                Recorded EXPLICITLY rather than computed by the generator. A
#                generator that derives names produces names nobody chose, and
#                a rename becomes invisible; that is how deduplicateMethods got
#                its positional fallback (see tests/api_snapshot.py). Here a
#                rename is a diff line someone approves.
#
#                Proposed by a rule — take the GENERATED method name and drop
#                the noun the namespace already says (create_webhook_source ->
#                create_source under `webhooks`) — then reviewed row by row.
#                Deriving from the generated name rather than the proto name
#                matters: buf renders CreateSQLProjection as
#                create_sql_projection, while a naive snake_case gives
#                create_s_q_l. Rows where the rule changed nothing keep the
#                generated name.
#
#                The generator does NOT re-derive the name it calls. It looks up
#                the one attribute on the generated client whose name matches
#                the RPC ignoring underscores, and fails closed if that is
#                missing or ambiguous.
#
# Rows are in proto declaration order within each service, matching the
# extraction order, so a diff against a regenerated list stays readable.

# Declared partition. The gate asserts these match the actual row counts AND
# that the sum equals the served set it derived independently.
#
# Why declare them instead of only counting rows: a per-path presence check
# catches a NEW rpc, but it cannot catch an EXISTING row being flipped from
# `rpc` to `rest` to dodge the work — every path still has a row, so the check
# passes. Changing a row's class now also means changing a number here, which
# is a deliberate, reviewable act instead of a one-word edit.
#
# The numbers live here and not in check-sdk-parity.sh so there is one place to
# edit, not two.
expect:
  rest: 4
  rpc: 97
  stream: 4
  unsupported: 1

rpcs:
  # ── IronflowService ──
  - path: ironflow.v1.IronflowService/RegisterFunction
    classification: rpc
    capability: functions
    method: register
  - path: ironflow.v1.IronflowService/GetFunction
    classification: rpc
    capability: functions
    method: get

  - path: ironflow.v1.IronflowService/ListFunctions
    classification: rpc
    capability: functions
    method: list

  - path: ironflow.v1.IronflowService/UpdateFunctionStatus
    classification: rpc
    capability: functions
    method: update_status
  - path: ironflow.v1.IronflowService/DeleteFunction
    classification: rpc
    capability: functions
    method: delete
  - path: ironflow.v1.IronflowService/ListFunctionHistory
    classification: rpc
    capability: functions
    method: list_history
  - path: ironflow.v1.IronflowService/GetFunctionAtVersion
    classification: rpc
    capability: functions
    method: get_at_version
  - path: ironflow.v1.IronflowService/RollbackFunction
    classification: rpc
    capability: functions
    method: rollback
  - path: ironflow.v1.IronflowService/Trigger
    classification: rpc
    capability: runs
    method: trigger
  - path: ironflow.v1.IronflowService/Emit
    classification: rpc
