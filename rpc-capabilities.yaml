  - path: ironflow.v1.ProjectionService/WaitProjectionCatchupStream
    classification: stream
    capability: projections
    method: wait_catchup_stream

  # ── QueryService ──
  - path: ironflow.v1.QueryService/ExecuteSQL
    classification: rpc
    capability: query
    method: execute_sql
    note: >-
      Was classification rest against POST /api/v1/sql. That route was removed in
      #1972 step 10, so Connect is the only transport and the facade owns the
      capability. Its own namespace rather than projections: the query is not
      projection-scoped, and gen_python_rpc.py refuses a namespace that spans two
      services.

  # ── DeploymentService ──
  # No REST siblings: executable deployment identity (ADR 0081, #2166) is a
  # Connect-only surface. Every row is a real capability the REST client
  # cannot answer at all — REST has no notion of a deployment.
  - path: ironflow.v1.DeploymentService/RegisterDeployment
    classification: rpc
    capability: deployments
    method: register
  - path: ironflow.v1.DeploymentService/GetDeployment
    classification: rpc
    capability: deployments
    method: get
  - path: ironflow.v1.DeploymentService/ListDeployments
