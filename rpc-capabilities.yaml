    classification: rpc
    capability: projections
    method: register
  - path: ironflow.v1.ProjectionService/UnregisterProjection
    classification: rest
    rest: "DELETE /api/v1/projections/{name}"
  - path: ironflow.v1.ProjectionService/StreamProjectionEvents
    classification: stream
    capability: projections
