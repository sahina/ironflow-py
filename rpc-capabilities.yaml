  - path: ironflow.v1.ProjectionService/GetProjection
    classification: rpc
    capability: projections
    method: get
  - path: ironflow.v1.ProjectionService/ListProjections
    classification: rpc
    capability: projections
    method: list
  - path: ironflow.v1.ProjectionService/ListProjectionHistory
