    method: list
  - path: ironflow.v1.DeploymentService/GetFunctionExecutionRouting
    classification: rpc
    capability: deployments
    method: get_execution_routing

  # ── EventSchemaService ──
  - path: ironflow.v1.EventSchemaService/RegisterSchema
    classification: rpc
    capability: event_schemas
    method: register
  - path: ironflow.v1.EventSchemaService/GetSchema
    classification: rpc
    capability: event_schemas
    method: get
  - path: ironflow.v1.EventSchemaService/ListSchemas
    classification: rpc
    capability: event_schemas
    method: list
  - path: ironflow.v1.EventSchemaService/DeleteSchema
    classification: rpc
    capability: event_schemas
    method: delete
  - path: ironflow.v1.EventSchemaService/ListSchemaHistory
    classification: rpc
    capability: event_schemas
    method: list_history
  - path: ironflow.v1.EventSchemaService/GetSchemaRevision
    classification: rpc
    capability: event_schemas
    method: get_revision
  - path: ironflow.v1.EventSchemaService/TestUpcast
    classification: rpc
    capability: event_schemas
    method: test_upcast
  # No REST sibling: this RPC was added for `ironflow event schema check`
  # (#1958) and the CLI speaks Connect. Exposed rather than skipped because it
  # is a real capability — "is enforcement actually enforcing" — that the REST
  # client cannot answer at all.
  - path: ironflow.v1.EventSchemaService/CheckEnforcement
    classification: rpc
    capability: event_schemas
    method: check_enforcement

  # ── WebhookService ──
  - path: ironflow.v1.WebhookService/CreateWebhookSource
